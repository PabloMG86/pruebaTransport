Shipment.findShipmentDetails=\
  SELECT s.shipment_id, s.departure_date, s.expected_arrival_date, \
         s.city_origin_fk, s.city_destination_fk, s.status, \
         co.city_code AS origin_code, co.name AS origin_name, co.handling_cost AS origin_handling, \
         cd.city_code AS dest_code, cd.name AS dest_name, cd.handling_cost AS dest_handling \
  FROM SHIPMENT s \
  JOIN CITY co ON co.city_code = s.city_origin_fk \
  JOIN CITY cd ON cd.city_code = s.city_destination_fk \
  WHERE s.shipment_id = :shipmentId